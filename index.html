<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🧠 IQ de Anime</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <h1>🧠 IQ de Anime</h1>
            <p>¡Demuestra cuánto sabes de tus animes favoritos!</p>
        </header>

        <!-- Pantalla de Selección -->
        <section id="selectScreen" class="screen active">
            <h2>🎯 Elige un Anime</h2>
            <div id="animeList" class="anime-grid"></div>
        </section>

        <!-- Pantalla de Configuración -->
        <section id="configScreen" class="screen hidden">
            <button id="back1" class="btn-back">← Volver</button>
            <div class="selected-anime-info">
                <span id="selEmoji" class="big-emoji"></span>
                <h2 id="selName"></h2>
            </div>

            <div class="config-box">
                <h3>📊 Nivel de Dificultad</h3>
                <div class="level-buttons">
                    <button class="level-btn active" data-level="facil">🌻 Fácil</button>
                    <button class="level-btn" data-level="medio">🔥 Medio</button>
                    <button class="level-btn" data-level="dificil">💀 Difícil</button>
                </div>

                <h3>📝 Cantidad de Preguntas</h3>
                <select id="qtySelect">
                    <option value="5">5 Preguntas</option>
                    <option value="10">10 Preguntas</option>
                    <option value="15" selected>15 Preguntas</option>
                </select>

                <button id="startBtn" class="btn-start">🚀 ¡Comenzar Quiz!</button>
            </div>
        </section>

        <!-- Pantalla del Quiz -->
        <section id="quizScreen" class="screen hidden">
            <div class="quiz-top">
                <button id="exitBtn" class="btn-exit">✕ Salir</button>
                <div class="quiz-info">
                    <span id="qCounter">Pregunta 1/15</span>
                    <span id="scoreLive">✅ 0 | ❌ 0</span>
                </div>
                <div class="progress-bar">
                    <div id="progressFill" class="progress-fill"></div>
                </div>
            </div>

            <div class="question-card">
                <h3 id="animeTag"></h3>
                <p id="questionText"></p>
            </div>

            <div id="optionsBox" class="options-container"></div>

            <div id="feedbackBox" class="feedback-box"></div>
            <button id="nextBtn" class="btn-next" disabled>Siguiente Pregunta →</button>
        </section>

        <!-- Pantalla de Resultado -->
        <section id="resultScreen" class="screen hidden">
            <div class="result-card">
                <span id="resultEmoji" class="result-emoji"></span>
                <h2 id="resultTitle"></h2>
                <p id="resultMsg"></p>
                
                <div class="result-stats">
                    <p>✅ Correctas: <span id="okCount">0</span></p>
                    <p>❌ Errores: <span id="errCount">0</span></p>
                    <p>📊 Porcentaje: <span id="percent">0%</span></p>
                </div>

                <div class="result-buttons">
                    <button id="retryBtn" class="btn-start">🔄 Intentar de Nuevo</button>
                    <button id="homeBtn" class="btn-back">🏠 Elegir Otro Anime</button>
                </div>
            </div>
        </section>
    </div>
    <script src="main.js"></script>
</body>
</html>
